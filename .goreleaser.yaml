version: 2

project_name: aletheia

builds:
  - main: ./cmd/aletheia
    binary: aletheia
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Reproducible archives: a rerun of a release produces the same files.
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Scoop bucket and Homebrew tap. Pushing to these repositories needs a token
# with write access to them: TAP_GITHUB_TOKEN (GITHUB_TOKEN in Actions only
# reaches this repository).
scoops:
  - repository:
      owner: firatmio
      name: scoop-bucket
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    homepage: https://aletheia.firattunaarslan.me
    description: Memory for coding agents that checks itself against your code.
    license: Apache-2.0

homebrew_casks:
  - repository:
      owner: firatmio
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    homepage: https://aletheia.firattunaarslan.me
    description: Memory for coding agents that checks itself against your code.
    # The binaries are not notarized; without this macOS quarantines them.
    # Linux has no xattr, and calling it there fails the install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aletheia"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
