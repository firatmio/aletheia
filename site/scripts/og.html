<html lang="en">
<head>

  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font: 400 20px/1 "IBM Plex Mono"; color: #8a8a8a; }

        <span><span class="ok">[ok]</span> builtins register in Builtins <span class="ptr">(builtin/registry.go:14-38)</span></span>
