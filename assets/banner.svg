    <ellipse cx="130" cy="84" rx="27" ry="0" fill="#5b4e8c"><animate attributeName="ry" dur="6.0s" repeatCount="indefinite" values="0;0;27;0;0;27;0;0" keyTimes="0;0.55;0.58;0.61;0.86;0.88;0.9;1"/></ellipse>
