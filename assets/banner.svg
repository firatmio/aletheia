  <text x="352" y="316" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="18" fill="#4b4860" opacity="0.85">a·lḗtheia (ἀλήθεια): truth, literally “un-forgetting”</text>
