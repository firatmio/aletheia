  <text x="22" y="134" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#4b4860">An anchor failed or it expired.</text>
  <text x="22" y="156" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#4b4860">Kept on disk, never sent.</text>
