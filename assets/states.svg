  <text x="22" y="98" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="28" font-weight="700" fill="#1f1d2b">unanchored</text>
  <text x="22" y="134" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#4b4860">No evidence attached: a hint,</text>
