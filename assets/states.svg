<svg xmlns="http://www.w3.org/2000/svg" width="980" height="210" viewBox="0 0 980 210" role="img" aria-label="Freshness states: verified, unanchored, stale" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Freshness states</title>
  <path d="M318 105.0 h14" stroke="#4b4860" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/><path d="M648 105.0 h14" stroke="#4b4860" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
<g transform="translate(10 10)">
