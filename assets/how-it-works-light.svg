<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="How Aletheia works: on every prompt it adds verified memories and a code map, the agent reads the exact lines, and when the agent stops Aletheia records which files changed."><rect width="1200" height="430" rx="16" fill="#f4f6f7"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4a586c" stroke-width="1.6"/></marker></defs><rect x="40" y="40" width="340" height="300" rx="12" fill="#ffffff" stroke="#d6dde3"/><text x="64" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#142033" text-anchor="start">1  You send a prompt</text><text x="64" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a586c" text-anchor="start">The prompt hook recalls for it.</text><rect x="430" y="40" width="340" height="300" rx="12" fill="#ffffff" stroke="#d6dde3"/><text x="454" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#142033" text-anchor="start">2  The agent works</text><text x="454" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a586c" text-anchor="start">It starts at the right lines.</text><rect x="820" y="40" width="340" height="300" rx="12" fill="#ffffff" stroke="#d6dde3"/><text x="844" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#142033" text-anchor="start">3  The agent stops</text><text x="844" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a586c" text-anchor="start">The stop hook records the change.</text><rect x="64" y="124" width="292" height="190" rx="8" fill="#0f1724"/><rect x="78" y="141" width="42" height="18" rx="4" fill="#e2f2ec"/><text x="85" y="154" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">ok</text><text x="128" y="154" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">New builtin: register in</text><text x="128" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">registry.go:35-1081</text><rect x="78" y="185" width="42" height="18" rx="4" fill="#e2f2ec"/><text x="85" y="198" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">ok</text><text x="128" y="198" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">Arity entry needed in</text><text x="128" y="216" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">builtin_test.go:263</text><rect x="78" y="229" width="50" height="18" rx="4" fill="#f8ecd9"/><text x="85" y="242" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a85f00">stale</text><text x="136" y="242" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea" text-decoration="line-through">Builtins live in builtin.go</text><text x="78" y="276" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6f7d91">stale: hidden from the agent</text><text x="78" y="302" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">code map: 4 files, 18 symbols</text><rect x="454" y="124" width="292" height="190" rx="8" fill="#0f1724"/><text x="468" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6f7d91">Read builtin/registry.go</text><text x="468" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6f7d91">     lines 35-60, not 1081</text><rect x="462" y="182" width="276" height="20" fill="#0f7a5a" opacity="0.22"/><text xml:space="preserve" x="468" y="196" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">var Builtins = []*Function{</text><text xml:space="preserve" x="468" y="216" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">    {</text><text xml:space="preserve" x="468" y="236" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">        Name: "abs",</text><text xml:space="preserve" x="468" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">        Fast: Abs,</text><text xml:space="preserve" x="468" y="276" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">    },</text><rect x="844" y="124" width="292" height="190" rx="8" fill="#0f1724"/><text x="858" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6f7d91">saved from the transcript:</text><text x="858" y="170" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">Map: a task like "Add a new</text><text x="858" y="192" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d7deea">builtin sign(x)" changed</text><text x="858" y="214" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">builtin/registry.go,</text><text x="858" y="236" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0f7a5a">builtin/lib.go, docs, tests</text><text x="858" y="258" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6f7d91">anchors: exists: each file</text><text x="858" y="280" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6f7d91">agent turns spent: 0</text><line x1="384" y1="190" x2="426" y2="190" stroke="#4a586c" stroke-width="1.6" marker-end="url(#ah)"/><line x1="774" y1="190" x2="816" y2="190" stroke="#4a586c" stroke-width="1.6" marker-end="url(#ah)"/><path d="M990 340 V378 Q990 392 976 392 H224 Q210 392 210 378 V346" fill="none" stroke="#4a586c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/><rect x="420" y="380" width="360" height="26" rx="13" fill="#f4f6f7"/><text x="600" y="398" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a586c" text-anchor="middle">every recall re-checks the anchors against your files</text></svg>
