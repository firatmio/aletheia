name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or saw, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands, a small project, or the memory file involved. Leave out anything private.
      render: shell
  - type: input
    id: version
    attributes:
      label: aletheia version
      description: The output of `aletheia version`.
      placeholder: aletheia 0.1.1
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How the agent uses it
      options:
        - Claude Code plugin
        - Claude Code hooks added by hand
        - Another MCP client
        - CLI only
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
